<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../css/user-details.css">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <h1>User Profile</h1>
        
        <!-- User Profile Section -->
        <div class="profile">
            <img id="userAvatar" src="" alt="User Avatar">
            <div id="userDetails">
                <h3 id="userName"></h3>
                <p><i class="fas fa-envelope"></i> <span id="userEmail"></span></p>
                <p><i class="fas fa-phone-alt"></i> <span id="userPhone"></span></p>
                <p><i class="fas fa-globe"></i> <a id="userWebsite" href="#" target="_blank"></a></p>
                <p><i class="fas fa-building"></i> <span id="userCompany"></span></p>
                <p><i class="fas fa-map-marker-alt"></i> <span id="userCity"></span></p>
            </div>
        </div>

        <h2>Posts</h2>
        <div id="userPosts" class="post-container"></div>
    </div>

    <!-- Comment Modal -->
    <div id="commentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Comments</h3>
            <div id="modalComments"></div>
        </div>
    </div>
    
    <script src="../js/user-details.js"></script>
</body>
</html>
